name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          Copy-Item target/release/jot.exe jot.exe
          Compress-Archive jot.exe "jot-${{ github.ref_name }}-windows-x64.zip"

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" jot.exe "jot-${{ github.ref_name }}-windows-x64.zip" `
            --title "jot ${{ github.ref_name }}" --generate-notes
